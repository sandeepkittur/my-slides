name: Dynatrace event ingest

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, closed, reopened]
  workflow_run:
    workflows: ["*"]
    types: [completed]

jobs:
  ingest-push-or-pr:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Send event to Dynatrace
        env:
          DT_URL: ${{ secrets.DT_ENV_URL }}
          DT_TOKEN: ${{ secrets.DT_API_TOKEN }}
        run: |
          echo "Posting to: ${DT_URL}/platform/ingest/custom/events/github.cicd"
          curl -sL -o /dev/null -w "%{http_code}" -X POST \
            "${DT_URL}/platform/ingest/custom/events/github.cicd" \
            -H "Content-Type: application/json" \
            -H "Authorization: Api-Token ${DT_TOKEN}" \
            -d '[{"event.type":"${{ github.event_name }}","event.status":"success","repository":"${{ github.repository }}","branch":"${{ github.ref_name }}","actor":"${{ github.actor }}","commit":"${{ github.sha }}"}]'

  ingest-workflow-result:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Send workflow result to Dynatrace
        env:
          DT_URL: ${{ secrets.DT_ENV_URL }}
          DT_TOKEN: ${{ secrets.DT_API_TOKEN }}
        run: |
          echo "Posting to: ${DT_URL}/platform/ingest/custom/events/github.cicd"
          curl -sL -o /dev/null -w "%{http_code}" -X POST \
            "${DT_URL}/platform/ingest/custom/events/github.cicd" \
            -H "Content-Type: application/json" \
            -H "Authorization: Api-Token ${DT_TOKEN}" \
            -d '[{"event.type":"workflow_run","event.status":"${{ github.event.workflow_run.conclusion }}","workflow":"${{ github.event.workflow_run.name }}","branch":"${{ github.event.workflow_run.head_branch }}","repository":"${{ github.repository }}","actor":"${{ github.event.workflow_run.triggering_actor.login }}"}]'
