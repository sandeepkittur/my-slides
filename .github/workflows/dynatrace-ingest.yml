name: Dynatrace event ingest

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, closed, reopened]
  workflow_run:
    workflows: ["*"]       # watches ALL other workflows
    types: [completed]

jobs:
  ingest-push-or-pr:
    # Runs on push and pull_request events
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Send event to Dynatrace
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${{ secrets.DT_ENV_URL }}/platform/ingest/v1/events/custom/github.cicd" \
            -H "Content-Type: application/json" \
            -H "Authorization: Api-Token ${{ secrets.DT_API_TOKEN }}" \
            -d '[{
              "event.type":   "${{ github.event_name }}",
              "event.status": "success",
              "repository":   "${{ github.repository }}",
              "branch":       "${{ github.ref_name }}",
              "actor":        "${{ github.actor }}",
              "commit":       "${{ github.sha }}",
              "workflow":     "${{ github.workflow }}",
              "run_id":       "${{ github.run_id }}"
            }]'

  ingest-workflow-result:
    # Runs when another workflow completes — captures the actual pass/fail
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Send workflow result to Dynatrace
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${{ secrets.DT_ENV_URL }}/platform/ingest/v1/events/custom/github.cicd" \
            -H "Content-Type: application/json" \
            -H "Authorization: Api-Token ${{ secrets.DT_API_TOKEN }}" \
            -d '[{
              "event.type":   "workflow_run",
              "event.status": "${{ github.event.workflow_run.conclusion }}",
              "workflow":     "${{ github.event.workflow_run.name }}",
              "branch":       "${{ github.event.workflow_run.head_branch }}",
              "repository":   "${{ github.repository }}",
              "actor":        "${{ github.event.workflow_run.triggering_actor.login }}",
              "run_id":       "${{ github.event.workflow_run.id }}",
              "run_url":      "${{ github.event.workflow_run.html_url }}"
            }]'
