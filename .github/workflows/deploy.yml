name: Deploy Slidev

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure git to use HTTPS with token
        run: |
          git config --global url."https://${{ secrets.THEME_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://${{ secrets.THEME_TOKEN }}@github.com/".insteadOf "git@github.com:"
      - run: npm install
      - run: npx slidev build --base /my-slides/
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
